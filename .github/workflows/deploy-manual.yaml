name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        type: string
        default: main

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: runonflux
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Ansible
        run: pip install ansible

      # The runner is persistent: the key lives in RUNNER_TEMP, which is
      # emptied after every job, and nothing is written to ~/.ssh.
      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/flux-cert-1.key"
          echo "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/flux-cert-1.key"

      - name: Run Deployment
        run: |
          cd ansible
          ansible-playbook -i inventory.yaml deploy.yaml \
            --private-key "$RUNNER_TEMP/flux-cert-1.key" \
            --ssh-common-args "-o IdentitiesOnly=yes -o StrictHostKeyChecking=no"
